; Alembic configuration for the migration component.
;
; The connection URL is deliberately absent here: it is composed at runtime in
; migrations/env.py from the POSTGRES_* environment variable contract (see
; src/config.py). Credentials must never be committed to this file.

[alembic]
; Revision scripts live in migrations/, relative to this file.
script_location = migrations

; Revision file naming: <sequence>_<slug>.py
file_template = %%(rev)s_%%(slug)s

; The component root is placed on sys.path so that migrations/env.py can import
; the src.config module when alembic is invoked from this directory.
prepend_sys_path = .

; Timestamps rendered into revision scripts use UTC.
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

; Log levels: the verbosity of this file's own output is not written into it.
; `logging.config.fileConfig` reads every `level` key literally, so a level set
; here could not be changed without rebuilding the image. The console handler is
; therefore a `src.config.ConsoleHandler`, which takes its level from the
; `LOG_LEVEL` variable of the settings contract (defaulting to INFO) - the same
; variable the structured logger of src/main.py uses. The logger sections below
; only decide which records are offered to that handler.

[logger_root]
level = WARNING
handlers = console
qualname =

; SQLAlchemy's engine logging stays off regardless of LOG_LEVEL: it renders every
; statement and its parameters, which for a migration run is noise, and the
; parameters may carry values that must not reach a log line.
[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

; Alembic's own progress output is offered in full to the console handler, which
; drops whatever LOG_LEVEL excludes.
[logger_alembic]
level = DEBUG
handlers =
qualname = alembic

; No `level` key: the level is set by the handler class named below, from
; LOG_LEVEL. A `level` here would be applied afterwards and would pin it again.
[handler_console]
class = src.config.ConsoleHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
